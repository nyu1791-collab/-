<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <title>朝チャレンジ — つづける</title>
  <meta name="description" content="寝坊すると遅刻1分ごとに課金。お金の力で早起きを習慣化する朝チャレンジ。" />
  <meta property="og:title" content="朝チャレンジ — つづける" />
  <meta property="og:description" content="目標時刻を過ぎると1分ごとにペナルティが加算。お金の力で早起きを習慣化。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="つづける" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__title">
        <h1>朝チャレンジ</h1>
        <p class="header__date" id="todayLabel"></p>
      </div>
      <div class="header__actions">
        <button class="btn btn--icon" id="installBtn" title="ホーム画面に追加" aria-label="ホーム画面に追加" hidden>📲</button>
        <button class="btn btn--icon" id="soundToggle" title="効果音" aria-label="効果音">🔊</button>
        <a class="btn btn--icon" href="index.html" title="習慣一覧へ" aria-label="習慣一覧へ">📋</a>
        <a class="btn btn--icon" href="stats.html" title="統計" aria-label="統計">📊</a>
        <button class="btn btn--icon" id="themeToggle" title="テーマ切り替え" aria-label="テーマ切り替え">🌙</button>
      </div>
    </header>

    <section class="mascot mascot--compact" id="mascot" aria-live="polite"></section>

    <!-- 今日の状態 -->
    <section class="morning-status" id="statusCard"></section>

    <!-- 起きた！ボタン / 認証 -->
    <section class="wake" id="wakeArea"></section>

    <!-- 残高 -->
    <section class="balance" id="balanceCard"></section>

    <!-- 設定 -->
    <details class="settings" id="settings">
      <summary>設定</summary>
      <form id="settingsForm" class="settings__form" autocomplete="off">
        <label class="field">
          <span>起床の目標時刻</span>
          <input type="time" id="targetTime" required />
        </label>
        <label class="field">
          <span>遅刻1分あたりの単価（円／分）</span>
          <input type="number" id="ratePerMin" min="0" step="10" required />
        </label>
        <label class="field">
          <span>1日の上限（円）</span>
          <input type="number" id="cap" min="0" step="100" required />
        </label>
        <label class="field">
          <span>支払いリンク（任意：Stripe / PayPay / Kyash 等のURL）</span>
          <input type="url" id="payUrl" placeholder="https://..." />
        </label>

        <div class="field field--switch">
          <label class="switch">
            <input type="checkbox" id="remMorning" />
            <span>起床リマインダー（目標時刻に通知）</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="remHabit" />
            <span>習慣リマインダー</span>
            <input type="time" id="remHabitTime" value="21:00" class="switch__time" />
          </label>
          <p class="settings__hint" id="remHint"></p>
        </div>

        <button type="submit" class="btn btn--primary">設定を保存</button>
        <p class="settings__hint">
          支払いリンクを入れておくと「支払う」ボタンからそのページを開けます。
        </p>
      </form>
    </details>

    <!-- 履歴 -->
    <section>
      <h2 class="section-title">直近の記録</h2>
      <ul class="log" id="logList"></ul>
    </section>

    <div class="cta">
      <button class="btn btn--ghost" id="shareBtn">📣 今朝の結果をシェア</button>
    </div>

    <footer class="footer">
      <p>データはこのブラウザ内にのみ保存されます。実際の引き落としは行われません。</p>
    </footer>
  </div>

  <script src="fun.js"></script>
  <script src="mascot.js"></script>
  <script src="reminders.js"></script>
  <script src="morning.js"></script>
</body>
</html>
